name: Deploy

# Деплой на VPS через SSH. Триггер: push в deploy-demo или ручной запуск.
# Сборка api идёт локально на VPS (без GHCR), seed запускается один раз через .seeded маркер.
on:
  push:
    branches: [deploy-demo]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build, restart, seed-once
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<'EOF'
          set -euo pipefail
          cd /opt/eduquiz

          git fetch origin deploy-demo
          git checkout deploy-demo
          git reset --hard origin/deploy-demo

          docker build -t local/eduquiz-api .
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

          if [ ! -f /opt/eduquiz/.seeded ]; then
            echo "Running seed (first time)..."
            docker run --rm \
              --network eduquiz_eduquiz_internal \
              -v /opt/eduquiz:/app \
              -w /app \
              -e ENV=production \
              -e JWT_SECRET="eduquiz-demo-jwt-secret-pls-rotate-after-defense-2026-05" \
              -e DATABASE_URL="postgres://eduquiz:eduquiz-demo-pgpwd-rotate-after-defense@postgres:5432/eduquiz?sslmode=disable" \
              -e POSTGRES_USER=eduquiz \
              -e POSTGRES_DB=eduquiz \
              -e POSTGRES_PASSWORD="eduquiz-demo-pgpwd-rotate-after-defense" \
              golang:1.25-bookworm \
              go run ./cmd/seed
            touch /opt/eduquiz/.seeded
          else
            echo "Seed marker found, skipping."
          fi

          docker image prune -f
          docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          EOF

      - name: Verify healthz
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          curl -fsS --max-time 10 --retry 5 --retry-delay 3 "http://${DEPLOY_HOST}/healthz"

      - name: Dump api+caddy logs (debug)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        if: always()
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<'EOF'
          cd /opt/eduquiz
          echo "=== api last 150 ==="
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=150 api 2>&1
          echo ""
          echo "=== caddy last 60 ==="
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=60 caddy 2>&1
          EOF
